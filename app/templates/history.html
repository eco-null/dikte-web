{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>{{ t("History") }}</h1>
  <div class="row">
    <button class="btn btn-danger" id="clear" hx-post="/api/history/clear"
            hx-swap="none" hx-on::after-request="location.reload()">{{ t("Clear history") }}</button>
  </div>
  <table class="table">
    <thead><tr><th></th><th>{{ t("Transcript") }}</th><th>{{ t("Model") }}</th><th></th></tr></thead>
    <tbody>
      {% for e in entries %}
      <tr id="row-{{ loop.index }}">
        <td><input type="checkbox" value='{{ e|tojson|forceescape }}' class="row-check" aria-label="{{ t('Select') }}"></td>
        <td class="transcript-cell">{{ e.text[:120] }}</td>
        <td>{{ e.model }}</td>
        <td><button class="btn btn-sm" data-copy data-target="#row-{{ loop.index }}">{{ t("Copy") }}</button></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <button class="btn" id="delete-selected">{{ t("Delete selected") }}</button>
</section>
<script>
  document.getElementById("delete-selected").addEventListener("click", async () => {
    const rows = [...document.querySelectorAll(".row-check:checked")].map((c) => JSON.parse(c.value));
    await fetch("/api/history", { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rows }) });
    location.reload();
  });
</script>
{% endblock %}
