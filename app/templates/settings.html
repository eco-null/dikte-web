{% extends "base.html" %}
{% block head %}<meta http-equiv="Cache-Control" content="no-store">{% endblock %}
{% block content %}
<section class="card">
  <div class="settings-head">
    <h1>{{ t("Settings") }}</h1>
    <button class="btn btn-primary" type="submit" form="settings-form">{{ t("Save") }}</button>
  </div>
  <form id="settings-form" class="settings-form">
    {% for section, keys in sections.items() %}
    <fieldset class="settings-section">
      <legend>{{ t(section) }}</legend>
      <div class="settings-grid">
        {% for key in keys %}{% if key in fields %}
        <label class="field">{{ t(key) }}
          {% if fields[key][0] == "bool" %}
          <select name="{{ key }}" data-kind="bool">
            <option value="on" {% if settings[key] %}selected{% endif %}>{{ t("On") }}</option>
            <option value="off" {% if not settings[key] %}selected{% endif %}>{{ t("Off") }}</option>
          </select>
          {% elif fields[key][0] == "select" %}
          <select name="{{ key }}">
            {% for choice in fields[key][1] %}
            <option value="{{ choice }}" {% if settings[key] == choice %}selected{% endif %}>{{ choice }}</option>
            {% endfor %}
          </select>
          {% elif key in masked %}
          <input name="{{ key }}" type="text" value="" placeholder="{{ settings[key] or t(key) }}">
          {% elif key.endswith("_prompt") %}
          <textarea name="{{ key }}" rows="3" placeholder="{{ t(key) }}">{{ settings[key] or '' }}</textarea>
          {% else %}
          <input name="{{ key }}" type="text" value="{{ settings[key] or '' }}" placeholder="{{ t(key) }}">
          {% endif %}
        </label>
        {% endif %}{% endfor %}
      </div>
    </fieldset>
    {% endfor %}
    <div class="save-bar">
      <button class="btn btn-primary" type="submit">{{ t("Save") }}</button>
      <p id="msg" class="stage save-msg" role="status"></p>
    </div>
  </form>
</section>

<section class="card" data-models>
  <h2>{{ t("Models") }}</h2>
  <p id="models-stage" class="stage" role="status"></p>
  <div id="models-loading" class="muted">{{ t("Loading…") }}</div>
  <div id="models-list"></div>
</section>
<script>
  document.getElementById("settings-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter || document.querySelector('#settings-form button[type="submit"]');
    const out = {};
    for (const el of e.target.elements) {
      if (!el.name) continue;
      out[el.name] = el.value;
      if (el.dataset.kind === "bool") out[el.name] = el.value === "on";
    }
    const msg = document.getElementById("msg");
    msg.className = "stage save-msg";
    msg.textContent = "Saving…";
    if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
    try {
      const resp = await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ settings: out }),
      });
      if (resp.ok) {
        msg.className = "stage save-msg save-ok";
        msg.textContent = "Saved successfully.";
      } else {
        msg.className = "stage save-msg save-err";
        msg.textContent = (await resp.json()).detail || resp.status;
      }
    } catch (err) {
      msg.className = "stage save-msg save-err";
      msg.textContent = "Save failed: " + err;
    }
    if (btn) { btn.disabled = false; btn.textContent = "{{ t('Save') }}"; }
  });

  async function loadModels() {
    const list = document.getElementById("models-list");
    const loading = document.getElementById("models-loading");
    loading.hidden = false;
    const resp = await fetch("/api/models");
    const data = await resp.json();
    loading.hidden = true;
    list.innerHTML = "";
    if (data.whisper_error) list.appendChild(notice(data.whisper_error));
    if (data.llm_error) list.appendChild(notice(data.llm_error));
    modelGroup(list, "Programs", (data.programs || []).map((p) => ({
      label: p.name + (p.system ? " (system)" : "") + (p.installed ? " — installed " + (p.version || "") : ""),
      installed: p.installed,
      install: () => installModel({ kind: "program", name: p.name }),
    })), 8);
    modelGroup(list, "Whisper models", (data.whisper_models || []).map((m) => ({
      label: m.name + (m.installed ? " (installed)" : ""),
      installed: m.installed,
      install: () => installModel({ kind: "whisper", name: m.name }),
      remove: m.installed ? () => deleteModel(m.path) : null,
    })), 6);
    for (const repo of data.llm || []) {
      modelGroup(list, repo.repo, (repo.quants || []).map((q) => ({
        label: q.name + (q.installed ? " (installed)" : ""),
        installed: q.installed,
        install: () => installModel({ kind: "llm", name: q.name, repo: repo.repo }),
        remove: q.installed ? () => deleteModel(q.path) : null,
      })), 5);
    }
  }

  function modelGroup(container, title, rows, visible) {
    const det = document.createElement("details");
    det.className = "model-group";
    det.open = true;
    const sum = document.createElement("summary");
    const head = document.createElement("span");
    head.textContent = title + " (" + rows.length + ")";
    sum.appendChild(head);
    det.appendChild(sum);
    const body = document.createElement("div");
    body.className = "model-group-body";
    const shown = rows.slice(0, visible);
    const hidden = rows.slice(visible);
    for (const r of shown) body.appendChild(modelRow(r));
    if (hidden.length) {
      const more = document.createElement("button");
      more.className = "btn btn-ghost btn-sm";
      more.textContent = "Show " + hidden.length + " more";
      more.addEventListener("click", () => {
        for (const r of hidden) body.appendChild(modelRow(r));
        more.remove();
      });
      body.appendChild(more);
    }
    det.appendChild(body);
    container.appendChild(det);
  }

  function modelRow(r) {
    const row = document.createElement("div");
    row.className = "model-row";
    row.appendChild(el("span", r.label));
    const acts = document.createElement("div");
    acts.className = "row";
    if (r.installed && r.remove) {
      const b = document.createElement("button");
      b.className = "btn btn-sm btn-danger";
      b.textContent = "Delete";
      b.addEventListener("click", r.remove);
      acts.appendChild(b);
    }
    if (!r.installed && r.install) {
      const b = document.createElement("button");
      b.className = "btn btn-sm btn-primary";
      b.textContent = "Install";
      b.addEventListener("click", r.install);
      acts.appendChild(b);
    }
    if (acts.childNodes.length) row.appendChild(acts);
    return row;
  }

  function el(tag, text) {
    const n = document.createElement(tag);
    n.textContent = text;
    return n;
  }
  function notice(text) {
    const p = document.createElement("p");
    p.className = "warn";
    p.textContent = text;
    return p;
  }
  async function installModel(payload) {
    const stage = document.getElementById("models-stage");
    stage.textContent = "Starting…";
    const resp = await fetch("/api/models/install", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (resp.status === 409) { stage.textContent = "Busy, one job at a time"; return; }
    if (!resp.ok) { stage.textContent = (await resp.json()).detail || resp.status; return; }
    const { job_id } = await resp.json();
    const tick = async () => {
      const job = await (await fetch("/api/jobs/" + job_id)).json();
      stage.textContent = job.status === "running" ? (job.stage || "Working…") : job.status;
      if (job.status === "done" || job.status === "failed") {
        if (job.status === "failed") stage.textContent = job.error || "Failed";
        loadModels();
        return;
      }
      setTimeout(tick, 2000);
    };
    tick();
  }
  async function deleteModel(path) {
    const stage = document.getElementById("models-stage");
    const resp = await fetch("/api/models/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
    stage.textContent = resp.ok ? "Deleted." : (await resp.json()).detail || resp.status;
    loadModels();
  }
  loadModels();
</script>
{% endblock %}
