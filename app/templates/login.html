{% extends "base.html" %}
{% block head %}<meta http-equiv="Cache-Control" content="no-store">{% endblock %}
{% block content %}
<section class="auth">
  <div class="card auth-card">
    <div class="auth-brand">
      <img src="/static/logo.png" alt="Dikte" width="48" class="auth-logo">
      <h1>Dikte</h1>
    </div>
    <p class="muted">{{ t("Sign in to continue") }}</p>
    <form method="post" action="/login" class="stack">
      <label class="field">{{ t("Password") }}
        <input type="password" name="password" autofocus required autocomplete="current-password">
      </label>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="btn btn-primary btn-block" type="submit">{{ t("Log in") }}</button>
    </form>
  </div>
</section>
{% endblock %}
