services:
  dikte-web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    user: "dikte"
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    pids_limit: 256
    environment:
      DIKTE_WEB_PASSWORD: "${DIKTE_WEB_PASSWORD:?DIKTE_WEB_PASSWORD env'ini bir .env dosyasında ver}"
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data/share
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OMNIROUTE_BASE_URL: "${OMNIROUTE_BASE_URL:-http://host.docker.internal:20128/v1}"
      DIKTE_MAX_UPLOAD: "${DIKTE_MAX_UPLOAD:-1073741824}"
      DIKTE_COOKIE_SECURE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dikte_data:/data
    restart: unless-stopped

volumes:
  dikte_data:

x-casaos:
  icon: ./icon.png
